<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="logosinfondo2.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin | Psicología Libros</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'pl-red':    '#D71920',
            'pl-red-dk': '#A8121A',
            'pl-coal':   '#111111',
            'pl-gold':   '#C9A24A',
            'pl-gold-dk':'#A4842F',
            'pl-ivory':  '#F8F4EA',
            'pl-gray':   '#4A4A4A',
            'pl-beige':  '#EFE6D4',
            'pl-white':  '#FFFFFF',
          },
          fontFamily: {
            display: ['"EB Garamond"', 'Georgia', 'serif'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          boxShadow: {
            'card':    '0 1px 2px rgba(17,17,17,0.04), 0 8px 24px -12px rgba(17,17,17,0.10)',
            'card-hv': '0 2px 6px rgba(17,17,17,0.05), 0 24px 40px -16px rgba(17,17,17,0.18)',
          },
        }
      }
    }
  </script>
  <style>
    body { background:#EFE6D4; font-family:'Inter',sans-serif; font-variant-numeric:lining-nums; -webkit-font-smoothing:antialiased; }
    .font-display { font-family:'EB Garamond',Georgia,serif; font-variant-numeric:lining-nums; }
    ::-webkit-scrollbar { width:6px; height:6px; }
    ::-webkit-scrollbar-track { background:#EFE6D4; }
    ::-webkit-scrollbar-thumb { background:#D4C5A8; border-radius:3px; }
    ::-webkit-scrollbar-thumb:hover { background:#C9A24A; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    .fade-in { animation: fadeIn 0.25s ease both; }
    input:focus,select:focus,textarea:focus { outline:2px solid #C9A24A; outline-offset:0; }
    .sidebar-link { display:flex; align-items:center; gap:10px; padding:9px 16px; font-size:13px; border-radius:4px; transition:all 0.15s; color:#6b7280; cursor:pointer; }
    .sidebar-link:hover { background:rgba(201,162,74,0.08); color:#111; }
    .sidebar-link.active { background:rgba(201,162,74,0.15); color:#111; font-weight:500; }
    .sidebar-link.active svg { color:#A4842F; }
    .stat-card { background:#fff; border:1px solid #E0D5C0; padding:20px 24px; }
    .bar-fill { height:8px; background:linear-gradient(90deg,#C9A24A,#A4842F); border-radius:2px; transition:width 0.6s ease; }
    .badge { display:inline-flex; align-items:center; padding:2px 8px; font-size:11px; font-weight:500; border-radius:2px; }
    .badge-green  { background:#dcfce7; color:#166534; }
    .badge-red    { background:#fee2e2; color:#991b1b; }
    .badge-yellow { background:#fef9c3; color:#854d0e; }
    .badge-gray   { background:#f3f4f6; color:#374151; }
    .table-row:hover { background:#FAF6EE; }
    /* Modal a nivel viewport: overlay en toda la pantalla; caja anclada arriba para que no se corte abajo */
    .modal-backdrop {
      position:fixed; left:0; top:0; right:0; bottom:0;
      z-index:150;
      margin:0; padding:1rem 1rem 1.25rem;
      box-sizing:border-box;
      background:rgba(17,17,17,0.72);
      display:flex; align-items:flex-start; justify-content:center;
      overflow-y:auto; overflow-x:hidden;
      -webkit-overflow-scrolling:touch;
    }
    .modal {
      background:#ffffff; width:100%; max-width:580px;
      max-height:calc(100dvh - 2rem);
      min-height:0;
      overflow-x:hidden; overflow-y:auto;
      box-shadow:0 20px 60px rgba(0,0,0,0.4);
      flex-shrink:0;
      margin-top:max(0.5rem, env(safe-area-inset-top, 0px));
    }
    .modal-wide { max-width:720px; }
    .modal input, .modal textarea, .modal select { border-radius:0 !important; }
    input:focus,select:focus,textarea:focus { outline:1px solid #C9A24A; outline-offset:0; }
    button:focus-visible { outline:2px solid #C9A24A; outline-offset:2px; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="src/icons.jsx?v=11"></script>
  <script type="text/babel" src="src/data.jsx?v=11"></script>
  <script type="text/babel" src="src/supabase.jsx?v=11"></script>
  <script type="text/babel" src="src/admin-app.jsx?v=11"></script>
</body>
</html>
